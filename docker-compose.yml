services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.docker}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.docker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - airsell-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.docker}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env.docker}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in .env.docker}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"

volumes:
  airsell-postgres:
