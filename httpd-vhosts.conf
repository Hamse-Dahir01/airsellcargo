<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "C:/xampp/htdocs/airsellcargo"

    <Directory "C:/xampp/htdocs/airsellcargo">
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyPass        /api http://127.0.0.1:3000/api
    ProxyPassReverse /api http://127.0.0.1:3000/api
</VirtualHost>