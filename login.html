<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a43">
  <title>Staff Login | Airsell Cargo</title>
  <style>
    :root {
      --navy: #102a43;
      --blue: #1769aa;
      --border: #d6dee8;
      --muted: #627d98;
      --danger: #b42318;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(135deg, #eef4f8 0%, #dce9f2 100%);
      color: var(--navy);
      font-family: Inter, Arial, sans-serif;
    }

    .login-card {
      width: min(100%, 430px);
      padding: 38px;
      border: 1px solid rgba(16, 42, 67, 0.08);
      border-radius: 16px;
      background: var(--white);
      box-shadow: 0 18px 50px rgba(16, 42, 67, 0.12);
    }

    .brand { margin: 0 0 8px; font-size: 27px; letter-spacing: -0.02em; }
    .subtitle { margin: 0 0 14px; color: var(--muted); }
    .home-link { display: inline-block; margin-bottom: 24px; color: var(--blue); font-size: 14px; font-weight: 700; text-decoration: none; }
    .home-link:hover { text-decoration: underline; }
    .field { margin-bottom: 18px; }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--navy);
      background: var(--white);
      font: inherit;
      outline: none;
      transition: border-color 160ms, box-shadow 160ms;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(23, 105, 170, 0.14);
    }

    .submit {
      width: 100%;
      height: 48px;
      margin-top: 4px;
      border: 0;
      border-radius: 8px;
      background: var(--navy);
      color: var(--white);
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: background 160ms, transform 160ms;
    }

    .submit:hover:not(:disabled) { background: var(--blue); }
    .submit:active:not(:disabled) { transform: translateY(1px); }
    .submit:disabled { cursor: wait; opacity: 0.68; }

    .message {
      min-height: 21px;
      margin: 14px 0 0;
      text-align: center;
      font-size: 14px;
    }

    .message.error { color: var(--danger); }
    .message.success { color: #087a55; }

    @media (max-width: 520px) {
      body { padding: 14px; }
      .login-card { padding: 28px 22px; }
    }
  </style>
</head>
<body>
  <main class="login-card" aria-labelledby="login-title">
    <h1 class="brand" id="login-title">Airsell Cargo</h1>
    <p class="subtitle">Sign in to the staff portal</p>
    <a class="home-link" href="index.html">← Return to Airsell Cargo home</a>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="320" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="200" required>
      </div>

      <button class="submit" id="submit-button" type="submit">Sign in</button>
      <p class="message" id="login-message" role="alert" aria-live="polite"></p>
    </form>
  </main>

  <script>
    const form = document.querySelector('#login-form');
    const emailInput = document.querySelector('#email');
    const passwordInput = document.querySelector('#password');
    const submitButton = document.querySelector('#submit-button');
    const message = document.querySelector('#login-message');

    function setMessage(text, type = '') {
      message.textContent = text;
      message.className = `message${type ? ` ${type}` : ''}`;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;

      if (!email || !emailInput.checkValidity()) {
        setMessage('Enter a valid email address.', 'error');
        emailInput.focus();
        return;
      }

      if (!password) {
        setMessage('Enter your password.', 'error');
        passwordInput.focus();
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = 'Signing in…';
      setMessage('');

      try {
        const response = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ email, password })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.error || 'Unable to sign in. Please try again.');
        }

        setMessage('Signed in successfully. Redirecting…', 'success');
        const roles = Array.isArray(data.user?.roles) ? data.user.roles : [];
        window.location.assign(roles.includes('admin') ? 'admin.html' : 'dashboard.html');
      } catch (error) {
        setMessage(error.message || 'Unable to sign in. Please try again.', 'error');
        passwordInput.select();
        submitButton.disabled = false;
        submitButton.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
